<style>
  html, body { margin: 0; height: 100%; background: white; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh;
          object-fit: contain; background: white; outline: none; }
  video.back { visibility: hidden; }

  /* Player text in CMU Sans Serif, like the slides' text (user, 2026-11-17). */

  /* Slide number, bottom-right of the picture; aiyagari.py keeps that corner clear. */
  #badge { position: fixed; z-index: 5; pointer-events: none; line-height: 1; white-space: nowrap;

  #badge:empty { display: none; }
  /* Proof jumps: #proof lies exactly on the chip drawn in the video; #back is a small chip

  .jump[hidden] { display: none; }
  #proof { background: transparent; border: 2px solid transparent; padding: 0; }
  #proof:hover { border-color: rgba(43, 89, 195, .5); }

  #back:hover { opacity: 1; }

let front = document.getElementById("a"), back = document.getElementById("b");
let i = 0, busy = false;

// Resolve once a video has a decoded frame on screen.
function frameReady(v) {
  return new Promise(res => {
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => res());
    else v.addEventListener("playing", () => requestAnimationFrame(() => res()), {once: true});
  });
}
function load(v, n) {
  return new Promise(res => {
    v.loop = SLIDES[n].loop;
    if (v.dataset.n == n && v.readyState >= 2) return res();
    v.dataset.n = n;
    v.src = SLIDES[n].src;
    v.addEventListener("loadeddata", () => res(), {once: true});
    v.load();
  });
}
function swap() {
  back.classList.remove("back"); front.classList.add("back");
  [front, back] = [back, front];
  front.focus();
}
async function show(n, atEnd) {
  if (n < 0 || n >= SLIDES.length || busy) return;
  busy = true;
  front.pause();
  await load(back, n);
  if (atEnd) {                       // going backwards: show the slide's last frame
    back.currentTime = Math.max(0, back.duration - 0.02);
    await new Promise(r => back.addEventListener("seeked", r, {once: true}));
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  } else {
    back.currentTime = 0;
    const ready = frameReady(back);
    back.play().catch(() => {});
    await ready;
  }
  swap();
  i = n;
  updateButtons();
  hint(`${i + 1} / ${SLIDES.length}`);
  busy = false;
  if (i + 1 < SLIDES.length) load(back, i + 1);   // preload the next slide
}

let hintT;
function hint(t) {
  const h = document.getElementById("hint");
  h.textContent = t; h.style.opacity = 1;
  clearTimeout(hintT); hintT = setTimeout(() => h.style.opacity = 0, 1200);
}
let idleT;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 1500);
});

function videoRect() {               // where the 16:9 picture sits inside the window
